build:
  gpu: true
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
  python_packages:
    - "whisply"
  run:
    # Create cache directory for models
    - mkdir -p /root/.cache/huggingface
    # Cache models by running whisply
    - whisply --model large-v3 --device gpu --lang en --files test/dummy.mp3
    - whisply --model distil-large-v3 --device gpu --lang en --files test/dummy.mp3
    - whisply --model large-v3-turbo --device gpu --lang en --files test/dummy.mp3
    # Clean up output files
    - rm -rf *.log transcriptions/

predict: "app.py:Predictor"
