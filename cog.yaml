build:
  gpu: true
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
  python_packages:
    - "whisply"
  run:
    # Create cache directory for models
    - mkdir -p /root/.cache/huggingface
    # Download all v3 Whisper models during build
    - pip install --no-cache-dir whisply && python -c "import whisply.cli; whisply.cli.download_models(['large-v3', 'distil-large-v3', 'large-v3-turbo'])"

predict: "app.py:Predictor"
