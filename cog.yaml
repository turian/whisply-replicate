build:
  gpu: true
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
  python_packages:
    - "whisply"
  run:
    # Create cache directory for models
    - mkdir -p /root/.cache/huggingface
    # Create test directory and generate dummy audio file
    - mkdir -p /src/test
    - ffmpeg -f lavfi -i "sine=frequency=440:duration=1" -c:a libmp3lame /src/test/dummy.mp3
    # Cache models by running whisply
    - bash -c '/root/.pyenv/shims/whisply --model large-v3 --device gpu --lang en --files /src/test/dummy.mp3 2>&1 | tee /tmp/whisply-large-v3.log'
    - bash -c '/root/.pyenv/shims/whisply --model distil-large-v3 --device gpu --lang en --files /src/test/dummy.mp3 2>&1 | tee /tmp/whisply-distil-large-v3.log'
    - bash -c '/root/.pyenv/shims/whisply --model large-v3-turbo --device gpu --lang en --files /src/test/dummy.mp3 2>&1 | tee /tmp/whisply-large-v3-turbo.log'
    # Clean up output files
    - rm -rf *.log transcriptions/

predict: "app.py:Predictor"
